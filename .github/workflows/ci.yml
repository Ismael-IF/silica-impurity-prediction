name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  qualite:
    name: Style et tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Contrôler le style
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Lancer les tests
        run: pytest

  pipeline:
    name: Reproductibilité du pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Le coeur de la promesse du projet : partir d'un dépôt propre et
      # retrouver les mêmes artefacts. Si une étape dépend d'un fichier
      # local non déclaré, c'est ici que ça casse.
      - name: Rejouer le pipeline de bout en bout
        run: dvc repro --force

      - name: Afficher les métriques obtenues
        run: dvc metrics show

      # Les métriques sont versionnées dans Git : toute dérive entre le
      # commit et la réexécution apparaît comme une modification.
      - name: Vérifier que les métriques versionnées sont à jour
        run: |
          git --no-pager diff --stat -- metrics/
          git diff --quiet -- metrics/ || {
            echo "::warning::Les métriques recalculées diffèrent de celles du dépôt."
            git --no-pager diff -- metrics/
          }

      - name: Conserver les figures produites
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: reports/figures/
